# То же, что docker-compose.yaml, но с GPU NVIDIA (нужен nvidia-container-toolkit):
#   docker compose -f docker-compose.yaml -f docker-compose.nvidia.yaml up
x-gpu: &gpu
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  scene: *gpu
  solution: *gpu
