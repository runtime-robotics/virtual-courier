# Публичный сценарий №1 — тренировочный полигон.
# Закрытые сценарии финала имеют тот же формат, но другие seed / станции / старт.

name: public_1
seed: 2026
grid: [8, 8]          # ячеек по X и Y
cell_size: 2.0        # м → полигон 16 × 16 м
loops: 0.18           # доля удалённых стен сверх идеального лабиринта (альтернативные маршруты)
obstacles: 10         # паллеты внутри ячеек
time_limit: 600       # с симуляционного времени
start_timeout: 120    # если решение не подало команд — таймер стартует сам

start:
  cell: [0, 0]
  side: W             # стена, у которой находится зона выгрузки
  yaw_deg: 0          # 0 — «лицом» по оси +X

stations:
  - {id: A, cell: [7, 2], side: E, active: true}
  - {id: B, cell: [4, 7], side: N, active: true}
  - {id: C, cell: [0, 6], side: W, active: true}
